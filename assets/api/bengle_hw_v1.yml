# =============================================================================
# Bengle firmware <-> app hardware contract (bengle_hw_v1.yml)
# =============================================================================
# contract_version: 6
#
# Generated from the firmware register table at firmware commit
# ebb12ab36a571dd248319e946e89d09d41d366b7 (rev-list count 711).
#
# contract_version 6: the native shaping profile block is version 2 only (28
# bytes); the firmware refuses version 1 with rule 1 (version). Block byte 0
# version 2; byte 1 modes and point count; byte 2 flow tau; byte 3 pressure
# tau; byte 4 pressure ramp tau; bytes 5-20 the points; byte 21 the pressure
# goal filter tau; byte 22 flow ramp tau; bytes 23-27 reserved 0. Each tau is
# U8, 0.02 s, 0-250. The app always writes the block to profile slots 21-24
# (frame indexes 0x15-0x18), 7 bytes each, after the extension frames and
# before the tail. Check order: version, modes, count, tau (bytes 2, 3, 21:
# rule 4), ramp (bytes 4, 22: rule 5), unused (points, then bytes 23-27:
# rule 6), curve. Row 66 bytes 4-31 hold the latched version 2 block. Row 66
# byte 3 bit 1 is 1 on an image that accepts block version 2. Row 66 keeps
# `since: unreleased`; the pin does not move.
#
# contract_version 5: adds row 66 NativeShapeLatched (read-only, 32 bytes),
# with `since: unreleased`: no released firmware serves it yet, so the pin
# above stays and the row is not in that firmware's register table. The other
# rows do not change. A row with `since: unreleased` is checked against this
# file only; when a released build serves it, the pin moves and the row gets
# that build as its `since`.
#
# contract_version 4: every writable row adds its effective write bound
# (effective_min / effective_max, bound_note).
#
# contract_version 3 (refresh to that pin): adds rows 33-35, 37, 38, 51-53
# and 62; FrontLEDColor and RearLEDColor are RW (live, not persisted); the
# 0xA013 Weight field is signed S16P4 and Flags carries bits 0-3. Rows 12 and
# 13 stay omitted (see below). Rows 59-61 (contract_version 2) exist at this
# pin.
#
# Change protocol: firmware changes a register -> regenerate this file from the
# new the firmware register table -> bump contract_version -> update the app enums (BengleMmr /
# BengleSteamMmr / BengleScaleMmr / BengleCalMmr / BengleLedMmr / MMRItem) ->
# the mmr_contract_test checker enforces agreement; firmware and app PRs both
# cite the contract_version.
#
# Normalization rules applied (binding):
#   * mult / min / max are only meaningful on firmware register-table rows with auto > 0 (the
#     macro read/write path). auto = 0 rows are served by hand-written firmware
#     cases; for those, `mult` below records the VERIFIED behaviour of the
#     hand-written path (which matches the the firmware register table column everywhere except
#     v13Model, whose mult=1000 column is inert -- recorded as mult: 1).
#   * min / max below are RAW WIRE UNITS (the little-endian int32 actually on
#     the wire). Where the firmware register table used post-divide engineering units, the original
#     engineering values are kept in a trailing comment.
#   * min/max encoding: where the firmware register table declares the full-u32 column
#     0..0xFFFFFFFF it is retained verbatim (for a u32 wire value that is
#     identical to "no constraint"); ScaleTare alone is normalized to
#     null/null because its written value is ignored entirely (pure trigger).
#     Deliberate, not drift -- a subset checker passes either encoding.
#   * Read-back on FLOAT-backed rows (EndOfShotWeight, LastTARE,
#     ScaleCalWeight, TargetMilkTemp, V24CurrentBudget, MatCurrentTemp): the
#     firmware macro read path scales BEFORE narrowing and rounds to nearest
#     (scaleForRead: round(engineering x mult)), so reads keep the full x-mult
#     resolution and a written value reads back unchanged. A stored value at
#     or below 0 reads as 0, so these rows can never read back negative.
#     (MatSetPoint is float-backed too: mult 1, whole-degC writes.)
#   * Write bounds (contract_version 4). `min` / `max` are the firmware
#     register table column. The firmware does not check that column on a
#     write: it divides the wire value by mult and gives the result to the
#     model setter, which clamps the value in the RAM model to the bound of
#     the model parameter table, with no error on the wire. On a persisted
#     row (RWD), flash keeps the raw written value until the next write;
#     after a reboot the load path calls the same clamping setter, so the
#     model is inside its bound again.
#     A row with its own write case follows that case. A row's hook acts on
#     the raw value before the clamp, so its effective bound comes from the
#     hook. Each writable row gives `effective_min` / `effective_max`: the
#     narrower of the column and the bound of the write path, in raw wire
#     units. `null` / `null` means no scalar bound applies (a trigger, an
#     ignored write or a set of values); `bound_note` says why, or how the
#     two bounds differ. Consumer rule: send only values inside the
#     effective bound, then read back to prove the stored value. Checker
#     semantics: the app range is a SUBSET of the column range, and on a
#     writable row with an effective range the app bounds EQUAL it.
#   * perms are canonicalized from the the firmware register table ENTRY column:
#     PERM_READ -> R, PERM_RT -> RT, PERM_RW -> RW, PERM_RWD -> RWD (persisted
#     to disk), PERM_RWT -> RWT (write triggers an action). The ENTRY column is
#     AUTHORITATIVE: the firmware register table's own header comment block disagrees with it on
#     row 33 (comment "RW" vs ENTRY PERM_READ) and rows 34/35/37 (comment "W"
#     vs ENTRY PERM_RWT); the firmware write macro verifiably enforces the
#     ENTRY perms. App enums carry no perms, so the checker does not compare
#     perms with the app; since contract_version 3 it pins the perms of named
#     rows against fixed expected values.
#   * `app_alias` is present only where the app's declared description string
#     differs from the firmware register name (TargetMilkTemp is the only
#     case). Rows are keyed by FIRMWARE name, so the alias records the
#     app-side name.
#   * Rows 12 (PrefGHCMCI) and 13 (MaxShotPres) are omitted: PERM_NONE TODO
#     stubs in firmware, unreachable and irrelevant to the app.
#   * All len=4 registers are little-endian int32 on the MMR wire. Addresses in
#     frames are 24-bit big-endian (the 0x00 top byte of 0x008038xx-style
#     addresses is discarded).
# =============================================================================

