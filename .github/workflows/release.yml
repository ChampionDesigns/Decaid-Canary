name: Create Release

on:
  push:
    tags:
      - 'v*'  # Triggers on tags like v1.0.0, v2.1.3, etc.

# bundle_skins.sh (invoked by flutter_with_commit.sh) hits api.github.com.
# Without auth, all jobs share the runner IP's 60 req/hr limit and silently
# get empty manifests. Expose GITHUB_TOKEN to every job so curl gets 5000/hr.
env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  release-metadata:
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Resolve tag and version
        id: meta
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          case "$TAG" in
            v*) VERSION="${TAG#v}" ;;
            *)
              echo "Expected a v* tag, got: $TAG" >&2
              exit 1
              ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build-android:
    needs: release-metadata
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.2'
          cache: true
          pub-cache: true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK 35
        uses: android-actions/setup-android@v4

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: ~/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: flutter pub get

      - name: Fetch external plugins
        shell: bash
        run: |
          ./scripts/fetch_dye2_plugin.sh
          ./scripts/fetch_shot_upload_plugin.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore Android signing keystore
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_B64"
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 --decode > android/app/canary-release.keystore

      - name: Build signed Android APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_PASSWORD"
          ./flutter_with_commit.sh build apk --release

      - name: Rename APK with version
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -f "$APK"
          mv "$APK" \
             build/app/outputs/flutter-apk/decaid-canary-android-${{ needs.release-metadata.outputs.version }}.apk

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/decaid-canary-android-${{ needs.release-metadata.outputs.version }}.apk

  build-macos:
    needs: release-metadata
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.2'
          cache: true
          pub-cache: true

      - name: Install dependencies
        run: |
          flutter pub get
          brew install automake libtool

      - name: Fetch external plugins
        shell: bash
        run: |
          ./scripts/fetch_dye2_plugin.sh
          ./scripts/fetch_shot_upload_plugin.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ---- Build (unsigned; no Developer ID, no notarization) ----
      - name: Build macOS app
        run: ./flutter_with_commit.sh build macos --release

      # ---- Final ZIP ----
      - name: Create release ZIP
        run: |
          cd build/macos/Build/Products/Release
          ditto -c -k --keepParent Decaid-Canary.app ../../../../../decaid-canary-macos-${{ needs.release-metadata.outputs.version }}.zip

      # ---- DMG (unsigned) ----
      - name: Create DMG
        run: |
          APP="build/macos/Build/Products/Release/Decaid-Canary.app"
          DMG_STAGE="$RUNNER_TEMP/dmg-stage"
          rm -rf "$DMG_STAGE"
          mkdir -p "$DMG_STAGE"
          cp -R "$APP" "$DMG_STAGE/"
          ln -s /Applications "$DMG_STAGE/Applications"
          hdiutil create \
            -volname Decaid-Canary \
            -srcfolder "$DMG_STAGE" \
            -ov -format UDZO \
            decaid-canary-macos-${{ needs.release-metadata.outputs.version }}.dmg

      - name: Verify DMG contents and launch
        run: |
          set -euo pipefail
          DMG="decaid-canary-macos-${{ needs.release-metadata.outputs.version }}.dmg"
          MOUNT="$RUNNER_TEMP/dmg-mount"
          rm -rf "$MOUNT"
          mkdir -p "$MOUNT"
          hdiutil attach "$DMG" -readonly -nobrowse -mountpoint "$MOUNT"
          trap 'hdiutil detach "$MOUNT" >/dev/null 2>&1 || true' EXIT
          test -d "$MOUNT/Decaid-Canary.app"
          test -L "$MOUNT/Applications"
          mkdir -p "$RUNNER_TEMP/Applications"
          cp -R "$MOUNT/Decaid-Canary.app" "$RUNNER_TEMP/Applications/"
          "$RUNNER_TEMP/Applications/Decaid-Canary.app/Contents/MacOS/Decaid-Canary" --print-storage-paths

      - uses: actions/upload-artifact@v7
        with:
          name: macos-app
          path: |
            decaid-canary-macos-${{ needs.release-metadata.outputs.version }}.zip
            decaid-canary-macos-${{ needs.release-metadata.outputs.version }}.dmg

  build-linux:
    needs: release-metadata
    # Pinned to 22.04 (same glibc baseline as ubuntu-22.04-arm) so the
    # tarball and AppImage run on older distributions; an AppImage cannot
    # bundle glibc.
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libsecret-1-dev squashfs-tools desktop-file-utils librsvg2-dev libgirepository1.0-dev libglib2.0-bin libgtk-3-bin libgdk-pixbuf2.0-bin xvfb

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.2'
          cache: true
          pub-cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Fetch external plugins
        shell: bash
        run: |
          ./scripts/fetch_dye2_plugin.sh
          ./scripts/fetch_shot_upload_plugin.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Linux app (unsigned)
        run: ./flutter_with_commit.sh build linux --release

      - name: Create Linux archive
        run: |
          cd build/linux/x64/release
          tar -czf ../../../../decaid-canary-linux-x64-${{ needs.release-metadata.outputs.version }}.tar.gz bundle

      - name: Package Linux AppImage
        run: |
          scripts/package_appimage.sh \
            build/linux/x64/release/bundle \
            x86_64 ${{ needs.release-metadata.outputs.version }} "$GITHUB_WORKSPACE"

      - name: Verify Linux AppImage structure and launch
        run: |
          scripts/verify_appimage.sh \
            decaid-canary-linux-x86_64-${{ needs.release-metadata.outputs.version }}.AppImage x86-64

      - name: Upload Linux app artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-app
          path: |
            decaid-canary-linux-x64-${{ needs.release-metadata.outputs.version }}.tar.gz
            decaid-canary-linux-x86_64-${{ needs.release-metadata.outputs.version }}.AppImage

  build-raspberrypi:
    name: Build for Raspberry Pi (ARM64 / Pi 4+)
    needs: release-metadata
    runs-on: ubuntu-22.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libsecret-1-dev squashfs-tools desktop-file-utils librsvg2-dev libgirepository1.0-dev libglib2.0-bin libgtk-3-bin libgdk-pixbuf2.0-bin xvfb

      - name: Set up Flutter
        id: flutter-action
        uses: subosito/flutter-action@v2
        with:
          # Flutter publishes no prebuilt arm64 Linux SDK; the master channel
          # path lets flutter-action git-clone the tagged version instead.
          channel: 'master'
          flutter-version: '3.44.2'
          cache: true
          pub-cache: true

      - name: Run git safe dir
        run: git config --global --add safe.directory /opt/hostedtoolcache/flutter/${{ steps.flutter-action.outputs.CHANNEL }}-${{ steps.flutter-action.outputs.VERSION }}-${{ steps.flutter-action.outputs.ARCHITECTURE }}

      - name: Install dependencies
        run: flutter pub get

      - name: Fetch external plugins
        shell: bash
        run: |
          ./scripts/fetch_dye2_plugin.sh
          ./scripts/fetch_shot_upload_plugin.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Linux app (ARM64)
        run: ./flutter_with_commit.sh build linux --release

      - name: Create Raspberry Pi archive
        run: |
          cd build/linux/arm64/release
          tar -czf ../../../../decaid-canary-linux-arm64-${{ needs.release-metadata.outputs.version }}.tar.gz bundle

      - name: Package Raspberry Pi AppImage
        run: |
          scripts/package_appimage.sh \
            build/linux/arm64/release/bundle \
            aarch64 ${{ needs.release-metadata.outputs.version }} "$GITHUB_WORKSPACE"

      - name: Verify Raspberry Pi AppImage structure and launch
        run: |
          scripts/verify_appimage.sh \
            decaid-canary-linux-aarch64-${{ needs.release-metadata.outputs.version }}.AppImage aarch64

      - name: Upload Raspberry Pi build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: raspberrypi-linux-arm64-app
          path: |
            decaid-canary-linux-arm64-${{ needs.release-metadata.outputs.version }}.tar.gz
            decaid-canary-linux-aarch64-${{ needs.release-metadata.outputs.version }}.AppImage

  build-windows:
    needs: release-metadata
    # Pinned: windows-latest rolled to VS 18 / MSVC 14.51, which hard-errors on
    # <experimental/coroutine> still used by flutter_inappwebview_windows and
    # permission_handler_windows. Revisit when plugins migrate to C++20 <coroutine>.
    runs-on: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.2'
          cache: true
          pub-cache: true

      - name: Install nuget
        uses: nuget/setup-nuget@v2
        with:
          nuget-version: 'latest'

      - name: Install dependencies
        run: flutter pub get

      - name: Fetch external plugins
        shell: bash
        run: |
          ./scripts/fetch_dye2_plugin.sh
          ./scripts/fetch_shot_upload_plugin.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Windows app (unsigned)
        shell: bash
        run: ./flutter_with_commit.sh build windows --release

      - name: Copy app-local VC++ runtime
        shell: pwsh
        run: |
          $crtDir = Get-ChildItem 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT' -Directory |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $crtDir) { throw 'VS 2022 VC runtime redist not found' }
          Copy-Item (Join-Path $crtDir.FullName '*.dll') 'build/windows/x64/runner/Release/'

      - name: Create Windows archive
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath decaid-canary-windows-x64-${{ needs.release-metadata.outputs.version }}.zip

      - name: Verify ZIP clean extraction and launch
        shell: pwsh
        run: |
          $zip = 'decaid-canary-windows-x64-${{ needs.release-metadata.outputs.version }}.zip'
          $extract = Join-Path $env:RUNNER_TEMP 'decaid-canary-extracted'
          Expand-Archive -Path $zip -DestinationPath $extract
          # GUI-subsystem executables cannot be awaited with & or -Wait on the
          # runner; inherit the console and wait with a bound.
          $exe = Join-Path $extract 'Decaid-Canary.exe'
          $proc = Start-Process -FilePath $exe -ArgumentList '--print-storage-paths' -NoNewWindow -PassThru
          if (-not $proc.WaitForExit(60000)) {
            $proc.Kill()
            throw 'Decaid-Canary.exe did not exit within 60s'
          }
          if ($proc.ExitCode -ne 0) { throw "Decaid-Canary.exe exited with code $($proc.ExitCode)" }
          foreach ($name in @('Decaid-Canary.exe','flutter_windows.dll','vcruntime140.dll','msvcp140.dll','data')) {
            if (-not (Test-Path (Join-Path $extract $name))) { throw "missing $name in extracted ZIP" }
          }

      - name: Upload Windows app artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-app
          path: decaid-canary-windows-x64-${{ needs.release-metadata.outputs.version }}.zip

  build-ios:
    needs: release-metadata
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Select latest Xcode
        run: xcodes select 26.3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.2'
          cache: true
          pub-cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Fetch external plugins
        shell: bash
        run: |
          ./scripts/fetch_dye2_plugin.sh
          ./scripts/fetch_shot_upload_plugin.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build IPA (unsigned)
        run: ./flutter_with_commit.sh build ipa --release --dart-define=APP_STORE=true --no-codesign

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app"
          OUTPUT_PATH="$GITHUB_WORKSPACE/decaid-canary-ios-unsigned-${{ needs.release-metadata.outputs.version }}.ipa"
          PACKAGE_DIR="$RUNNER_TEMP/unsigned-ipa"

          test -d "$APP_PATH"

          rm -rf "$PACKAGE_DIR"
          mkdir -p "$PACKAGE_DIR/Payload"
          cp -R "$APP_PATH" "$PACKAGE_DIR/Payload/Runner.app"

          cd "$PACKAGE_DIR"
          zip -qry "$OUTPUT_PATH" Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v7
        with:
          name: ios-ipa-unsigned
          path: decaid-canary-ios-unsigned-${{ needs.release-metadata.outputs.version }}.ipa
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    needs: [release-metadata, build-android, build-macos, build-linux, build-raspberrypi, build-windows, build-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts

      - name: Display structure of downloaded files
        run: ls -R release-artifacts

      - name: Assert expected release artifacts
        run: |
          set -euo pipefail
          VERSION="${{ needs.release-metadata.outputs.version }}"
          EXPECTED=(
            "release-artifacts/android-apk/decaid-canary-android-${VERSION}.apk"
            "release-artifacts/macos-app/decaid-canary-macos-${VERSION}.zip"
            "release-artifacts/macos-app/decaid-canary-macos-${VERSION}.dmg"
            "release-artifacts/linux-app/decaid-canary-linux-x64-${VERSION}.tar.gz"
            "release-artifacts/linux-app/decaid-canary-linux-x86_64-${VERSION}.AppImage"
            "release-artifacts/raspberrypi-linux-arm64-app/decaid-canary-linux-arm64-${VERSION}.tar.gz"
            "release-artifacts/raspberrypi-linux-arm64-app/decaid-canary-linux-aarch64-${VERSION}.AppImage"
            "release-artifacts/windows-app/decaid-canary-windows-x64-${VERSION}.zip"
            "release-artifacts/ios-ipa-unsigned/decaid-canary-ios-unsigned-${VERSION}.ipa"
          )
          for f in "${EXPECTED[@]}"; do
            [ -f "$f" ] || { echo "FAIL: missing $f" >&2; exit 1; }
          done

      - name: Generate SHA-256 manifest
        run: |
          set -euo pipefail
          VERSION="${{ needs.release-metadata.outputs.version }}"
          cd release-artifacts
          find . -type f -print0 | sort -z | xargs -0 sha256sum \
            | sed 's| \./[^/]*/| |' > "../decaid-canary-${VERSION}-SHA256SUMS.txt"
          cd ..
          cat "decaid-canary-${VERSION}-SHA256SUMS.txt"

      - name: Create stable aliases for every artifact
        env:
          VERSION: ${{ needs.release-metadata.outputs.version }}
        run: scripts/create_release_aliases.sh release-artifacts "$VERSION"

      - name: Generate release notes
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="${{ needs.release-metadata.outputs.tag }}" \
            --jq .body > release-notes.md
          test -s release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/android-apk/*
            release-artifacts/macos-app/*
            release-artifacts/linux-app/*
            release-artifacts/raspberrypi-linux-arm64-app/*
            release-artifacts/windows-app/*
            release-artifacts/ios-ipa-unsigned/*
            decaid-canary-${{ needs.release-metadata.outputs.version }}-SHA256SUMS.txt
            decaid-canary-latest-SHA256SUMS.txt
          tag_name: ${{ needs.release-metadata.outputs.tag }}
          name: Decaid-Canary ${{ needs.release-metadata.outputs.version }}
          draft: false
          prerelease: ${{ contains(needs.release-metadata.outputs.version, 'beta') || contains(needs.release-metadata.outputs.version, 'alpha') || contains(needs.release-metadata.outputs.version, 'rc') }}
          body_path: release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
