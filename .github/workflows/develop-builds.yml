name: Development build

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build (push to main always builds all)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - android
          - macos
          - linux
          - raspberrypi
          - ios
          - windows

# bundle_skins.sh (invoked by flutter_with_commit.sh) hits api.github.com.
# Without auth, all jobs share the runner IP's 60 req/hr limit and silently
# get empty manifests. Expose GITHUB_TOKEN to every job so curl gets 5000/hr.
env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build-android:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'android'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set build identifier
        id: build-id
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.2'
          cache: true
          pub-cache: true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK 35
        uses: android-actions/setup-android@v4

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: ~/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: flutter pub get

      - name: Fetch external plugins
        shell: bash
        run: |
          ./scripts/fetch_dye2_plugin.sh
          ./scripts/fetch_shot_upload_plugin.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore Android signing keystore
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_B64"
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 --decode > android/app/canary-release.keystore

      - name: Build signed Android APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_PASSWORD"
          ./flutter_with_commit.sh build apk --release

      - name: Package Android APK
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -f "$APK"
          cp "$APK" decaid-canary-android-develop-${{ steps.build-id.outputs.short_sha }}.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v7
        with:
          name: decaid-canary-android-develop
          path: decaid-canary-android-develop-${{ steps.build-id.outputs.short_sha }}.apk
          if-no-files-found: error

  build-macos:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'macos'
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set build identifier
        id: build-id
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Install automake and libtool
        run: brew install automake libtool

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.2'
          cache: true
          pub-cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Fetch external plugins
        shell: bash
        run: |
          ./scripts/fetch_dye2_plugin.sh
          ./scripts/fetch_shot_upload_plugin.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ---- Build ----
      - name: Build macOS app
        run: ./flutter_with_commit.sh build macos --release

      # ---- Upload ----
      - name: Create development ZIP
        run: |
          cd build/macos/Build/Products/Release
          ditto -c -k --keepParent Decide.app ../../../../../decaid-canary-macos-develop-${{ steps.build-id.outputs.short_sha }}.zip

      - name: Upload macOS app
        uses: actions/upload-artifact@v7
        with:
          name: decaid-canary-macos-develop
          path: decaid-canary-macos-develop-${{ steps.build-id.outputs.short_sha }}.zip
          if-no-files-found: error

  build-linux:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'linux'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set build identifier
        id: build-id
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libsecret-1-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.2'
          cache: true
          pub-cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Fetch external plugins
        shell: bash
        run: |
          ./scripts/fetch_dye2_plugin.sh
          ./scripts/fetch_shot_upload_plugin.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Linux app (unsigned)
        run: ./flutter_with_commit.sh build linux --release

      - name: Create Linux archive
        run: |
          cd build/linux/x64/release
          tar -czf ../../../../decaid-canary-linux-x64-develop-${{ steps.build-id.outputs.short_sha }}.tar.gz bundle

      - name: Upload Linux app
        uses: actions/upload-artifact@v7
        with:
          name: decaid-canary-linux-x64-develop
          path: decaid-canary-linux-x64-develop-${{ steps.build-id.outputs.short_sha }}.tar.gz
          if-no-files-found: error

  build-raspberrypi:
    name: Build for Raspberry Pi (ARM64 / Pi 4+)
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'raspberrypi'
    runs-on: ubuntu-22.04-arm     # ARM64 hosted runner label
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libsecret-1-dev

      - name: Set build identifier
        id: build-id
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        id: flutter-action
        uses: subosito/flutter-action@v2
        with:
          # Flutter publishes no prebuilt arm64 Linux SDK; the master channel
          # path lets flutter-action git-clone the tagged version instead.
          channel: 'master'
          flutter-version: '3.44.2'
          cache: true
          pub-cache: true

      - name: Run git safe dir
        run: git config --global --add safe.directory /opt/hostedtoolcache/flutter/${{ steps.flutter-action.outputs.CHANNEL }}-${{ steps.flutter-action.outputs.VERSION }}-${{ steps.flutter-action.outputs.ARCHITECTURE }}

      - name: Install dependencies
        run: flutter pub get

      - name: Fetch external plugins
        shell: bash
        run: |
          ./scripts/fetch_dye2_plugin.sh
          ./scripts/fetch_shot_upload_plugin.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Linux app (ARM64)
        run: ./flutter_with_commit.sh build linux --release

      - name: Create Raspberry Pi archive
        run: |
          cd build/linux/arm64/release
          tar -czf ../../../../decaid-canary-linux-arm64-develop-${{ steps.build-id.outputs.short_sha }}.tar.gz bundle

      - name: Upload Raspberry Pi build (ARM64)
        uses: actions/upload-artifact@v7
        with:
          name: decaid-canary-linux-arm64-develop
          path: decaid-canary-linux-arm64-develop-${{ steps.build-id.outputs.short_sha }}.tar.gz
          if-no-files-found: error

  build-ios:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'ios'
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set build identifier
        id: build-id
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Select latest Xcode
        run: xcodes select 26.3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.2'
          cache: true
          pub-cache: true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.2'
          cache: true
          pub-cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Fetch external plugins
        shell: bash
        run: |
          ./scripts/fetch_dye2_plugin.sh
          ./scripts/fetch_shot_upload_plugin.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build IPA
        run: ./flutter_with_commit.sh build ipa --release --dart-define=APP_STORE=true --no-codesign

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app"
          OUTPUT_PATH="$GITHUB_WORKSPACE/decaid-canary-ios-unsigned-develop-${{ steps.build-id.outputs.short_sha }}.ipa"
          PACKAGE_DIR="$RUNNER_TEMP/unsigned-ipa"

          test -d "$APP_PATH"

          rm -rf "$PACKAGE_DIR"
          mkdir -p "$PACKAGE_DIR/Payload"
          cp -R "$APP_PATH" "$PACKAGE_DIR/Payload/Runner.app"

          cd "$PACKAGE_DIR"
          zip -qry "$OUTPUT_PATH" Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v7
        with:
          name: decaid-canary-ios-unsigned-develop
          path: decaid-canary-ios-unsigned-develop-${{ steps.build-id.outputs.short_sha }}.ipa
          if-no-files-found: error


  build-windows:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'windows'
    # Pinned: windows-latest rolled to VS 18 / MSVC 14.51, which hard-errors on
    # <experimental/coroutine> still used by flutter_inappwebview_windows and
    # permission_handler_windows. Revisit when plugins migrate to C++20 <coroutine>.
    runs-on: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set build identifier
        id: build-id
        shell: bash
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.2'
          cache: true
          pub-cache: true

      - name: Install nuget
        uses: nuget/setup-nuget@v2
        with:
          nuget-version: 'latest'

      - name: Install dependencies
        run: flutter pub get

      - name: Fetch external plugins
        shell: bash
        run: |
          ./scripts/fetch_dye2_plugin.sh
          ./scripts/fetch_shot_upload_plugin.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Windows app (unsigned)
        shell: bash
        run: ./flutter_with_commit.sh build windows --release

      - name: Create Windows archive
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath decaid-canary-windows-x64-develop-${{ steps.build-id.outputs.short_sha }}.zip

      - name: Upload Windows app
        uses: actions/upload-artifact@v7
        with:
          name: decaid-canary-windows-x64-develop
          path: decaid-canary-windows-x64-develop-${{ steps.build-id.outputs.short_sha }}.zip
          if-no-files-found: error




